name: tam_customer
description: Tam customer mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  bloc_concurrency: ^0.3.0
  get_it: ^9.2.1
  go_router: ^17.0.1
  dio: ^5.9.2
  sqflite: ^2.4.2+1
  intl: ^0.20.2
  url_launcher: ^6.3.3
  maplibre_gl: 0.27.1
  flutter_svg: 2.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.6.0
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  geolocator_platform_interface: ^4.4.1

flutter:
  assets:
    - assets/images/
    - assets/animations/
    - assets/maps/
    - assets/notifications/
  uses-material-design: true
  generate: true
  licenses:
    - assets/fonts/NOTO-LICENSE.txt
    - assets/maps/OPENFREEMAP-LICENSE.md
    - assets/maps/LIBERTY-LICENSE.md
  fonts:
    - family: TamSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: TamSansLatin
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
