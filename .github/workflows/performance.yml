name: Tam performance and quality
on:
  push:
    branches: [main, hazem-dev]
  # Self-hosted runner executes repository code on the developer's laptop.
  # Do not accept pull_request from forks on this runner.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  customer:
    name: Customer / regression report
    runs-on: [self-hosted, Linux, X64, mashwar-ci]
    timeout-minutes: 65
    env:
      CI_METRICS_DIR: ${{ github.workspace }}/.ci-metrics
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use preinstalled Flutter / Android SDK
        run: |
          echo "$HOME/development/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Android/Sdk/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          test -x "$HOME/development/flutter/bin/flutter"
          test -x "$HOME/Android/Sdk/platform-tools/adb"
          java -version
      - name: Validate backend PHP when installed
        run: |
          if command -v php >/dev/null; then
            find backend/laravel -name '*.php' -print0 | xargs -0 -n1 php -l
            php backend/laravel/tests/routing_selector_smoke.php
          else
            echo "PHP CLI not installed locally — backend lint was not executed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve packages
        working-directory: apps/customer
        run: flutter pub get
      - name: Formatting
        working-directory: apps/customer
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        working-directory: apps/customer
        run: flutter analyze
      - name: Functional tests
        working-directory: apps/customer
        run: |
          set -o pipefail
          mkdir -p "$CI_METRICS_DIR"
          flutter test -r expanded | tee "$CI_METRICS_DIR/flutter-tests.log"
          flutter test test/core/cache/cache_policy_test.dart -r expanded > "$CI_METRICS_DIR/cache-tests.log"
          echo 1 > "$CI_METRICS_DIR/cache_checks.txt"
          flutter test test/core/network/request_coalescer_test.dart -r expanded > "$CI_METRICS_DIR/coalescer-tests.log"
          echo 1 > "$CI_METRICS_DIR/offline_checks.txt"
      - name: Android release build and isolated emulator benchmark
        run: bash scripts/ci/android_smoke.sh
      - name: Collect current measurements
        if: always()
        run: python3 scripts/ci/metrics.py collect --repo . --output "$CI_METRICS_DIR/current.json"
      - name: Obtain previous successful metrics
        if: always()
        continue-on-error: true
        env:
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/ci/fetch_baseline.sh
      - name: Report performance changes
        if: always()
        run: |
          python3 scripts/ci/metrics.py report --current "$CI_METRICS_DIR/current.json" --baseline "$CI_METRICS_DIR/baseline/metrics.json" --markdown "$CI_METRICS_DIR/report.md"
          cat "$CI_METRICS_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve report locally on developer machine
        if: always()
        run: bash scripts/ci/save_local_report.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: .ci-metrics/
          retention-days: 90
